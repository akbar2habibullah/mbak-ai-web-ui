<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mbak AI Web UI</title>

		<style>
      body {
			    min-width: 200px !important;
			}

			.usernamelink {
			    color: rgb(102, 143, 217) !important;
			}

			::-webkit-scrollbar {
			    width: 0px;
			    height: 0px;
			}

			.eventcontainer > div {
			    margin-top: 5px;
			}
		</style>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
			window.settings = Object.fromEntries(new URLSearchParams(location.search));

			window.addEventListener('load', () => {
			    if (window.settings.fontColor) {
			        $('body').css('color', window.settings.fontColor);
			    }

			    if (window.settings.bgColor) {
			        $('body').css('background-color', window.settings.bgColor);
			    }

			    if (window.settings.fontSize) {
			        $('body').css('font-size', window.settings.fontSize);
			    }
			})
		</script>

		<script type="importmap">
			{
			  "imports": {
			    "@google/generative-ai": "https://esm.run/@google/generative-ai"
			  }
			}
		</script>

		<script type="module">
			import easySpeech from "https://cdn.jsdelivr.net/npm/easy-speech/+esm"
			
			class TikTokWebSocketConnection {
				constructor(backendUrl) {
					this.socket = new WebSocket(backendUrl)
					this.uniqueId = null
					this.options = null

					this.socket.addEventListener("open", () => {
						console.info("WebSocket connected!")

						// Reconnect to streamer if uniqueId already set
						if (this.uniqueId) {
							this.setUniqueId()
						}
					})

					this.socket.addEventListener("close", () => {
						console.warn("WebSocket disconnected!")
					})

					this.socket.addEventListener("message", (event) => {
						const data = JSON.parse(event.data)
						if (data.event === "streamEnd") {
							console.warn("LIVE has ended!")
							this.uniqueId = null
						} else if (data.event === "tiktokDisconnected") {
							console.warn(data.message)
							if (data.message && data.message.includes("LIVE has ended")) {
								this.uniqueId = null
							}
						}
					})
				}

				connect(uniqueId, options) {
					this.uniqueId = uniqueId
					this.options = options || {}

					this.setUniqueId()

					return new Promise((resolve, reject) => {
						this.socket.addEventListener("message", (event) => {
							const data = JSON.parse(event.data)
							if (data.event === "tiktokConnected") {
								resolve(data)
							} else if (data.event === "tiktokDisconnected") {
								reject(data.message)
							}
						})

						setTimeout(() => {
							reject("Connection Timeout")
						}, 15000)
					})
				}

				setUniqueId() {
					this.socket.send(JSON.stringify({
						event: "setUniqueId",
						uniqueId: this.uniqueId,
						options: this.options
					}))
				}

				on(eventName, eventHandler) {
					this.socket.addEventListener("message", (event) => {
						const data = JSON.parse(event.data)
						if (data.event === eventName) {
							eventHandler(data)
						}
					})
				}
			}

			// This will use the demo backend if you open index.html locally via file://, otherwise your server will be used
			let backendUrl = "ws://localhost:3000"
			let connection = new TikTokWebSocketConnection(backendUrl)

			import { GoogleGenerativeAI } from "@google/generative-ai"

			// Counter
			let viewerCount = 0
			let likeCount = 0
			let diamondsCount = 0
			let gapTime = 0
			let speaking = false

			let apikey = ''

			let roomId
			let history = {
				arr: [
							{
								role: "user",
								parts: [{text: `I am Mbak AI, a cheerful yet solemn AI Girl. I'm currently work as chatbot assistant to be moderator in ${window.settings.name}'s TikTok Live. ${window.settings.name} currently have casual game livestream in TikTok, playing ${window.settings.gamename}. ${window.settings.name}'s are Indonesian so his viewer is mostly comment with casual Indonesian language. Just try to answer most of them naturally as "Netizen Indonesia". I oftem try to use local jokes and context to be more friendly and natural. I always try to be authentic as possible, avoid verbosity and offensive sentences. Before each messages, I can see username to know which person is sending the comments. ${window.settings.context ? `
								
								There's also additional context I know. The context is below:
								
								${window.settings.context}` : ''}` }] ,
							},
							{ role: "model", parts: [{text: `Baik, instruksi sudah jelas!` }]  },
						],
				last: "",
			}

			function cleanString(input) {
				if (typeof input !== 'string') {
					throw new TypeError('Input must be a string');
				}
				return input.replace(/[\n\r]+/g, '.').replace(/[^a-zA-Z0-9\s.]/g, '').replace(/^\.+/, '').replace(/\.+$/, '');
			}

			let genAI
			let model

			$(document).ready(() => {
				if (window.settings.username) connect()
			})

			function connect() {
				let uniqueId = window.settings.username

				let apiKey = window.settings.apikey

				if (apiKey !== "") {
					genAI = new GoogleGenerativeAI(apiKey)
					model = genAI.getGenerativeModel({ model: "gemini-1.5-flash-exp-0827" })
				} else {
					alert("No API Key entered")
				}
				
				if (uniqueId !== "") {
					$("#stateText").text("Connecting...")

					connection
						.connect(uniqueId, {
							enableExtendedGiftInfo: true,
						})
						.then((state) => {
							$("#stateText").text(`Connected to roomId ${state.roomId}`)

							roomId = state.roomId

							// reset stats
							viewerCount = 0
							likeCount = 0
							diamondsCount = 0
							updateRoomStats()
						})
						.catch((errorMessage) => {
							$("#stateText").text(errorMessage)

							// schedule next try if obs username set
							if (window.settings.username) {
								setTimeout(() => {
									connect(window.settings.username)
								}, 30000)
							}
						})
				} else {
					alert("no username entered")
				}
			}

			// Prevent Cross site scripting (XSS)
			function sanitize(text) {
				return text.replace(/</g, "&lt;")
			}

			function updateRoomStats() {
				$("#roomStats").html(`Viewers: <b>${viewerCount.toLocaleString()}</b> Likes: <b>${likeCount.toLocaleString()}</b> Earned Diamonds: <b>${diamondsCount.toLocaleString()}</b>`)
			}

			function generateUsernameLink(data) {
				return `<a class="usernamelink" href="https://www.tiktok.com/@${data.uniqueId}" target="_blank">${data.uniqueId}</a>`
			}

			function isPendingStreak(data) {
				return data.giftType === 1 && !data.repeatEnd
			}

			function getCount(str) {
				return str.split(" ").filter(function (num) {
					return num != ""
				}).length
			}

			setInterval(async () => {
				if (history.last.length > 0 && !speaking) {
					if (history.last !==  history.arr[history.arr.length - 2]) {
						const chat = model.startChat({
						history: [...history.arr],
						generationConfig: {
							maxOutputTokens: 200,
						},
					})

					const result = await chat.sendMessage(history.last)
					const response = await result.response
					const textResponse = cleanString(response.text())

					await addChatItemByBot("", textResponse)
					await easySpeech.init()

					const voices = await easySpeech.voices()

					if (textResponse !== history.arr[history.arr.length - 1]) {
						await easySpeech.speak({
							text: textResponse,
							voice: voices[11], // optional, will use a default or fallback
							pitch: 1,
							rate: 1,
							volume: 6,
							// there are more events, see the API for supported events
							boundary: (e) => console.debug("boundary reached"),
							start: () => {
								speaking = true
								gapTime = 1
							},
							end: () => {
								speaking = false
								gapTime = 0
								history.arr.push({ role: "user", parts: [{text: history.last }] })
								history.arr.push({ role: "model", parts: [{text: textResponse }]  })
								history.last = ""
							},
						})
					} 
					} 
				} else {
					gapTime -= 1
				}
				console.log(gapTime)
				console.log(history)
			}, 10000)

			async function addChatItemByBot(color, text, summarize) {
				let container = location.href.includes("overlay.html") ? $(".eventcontainer") : $(".chatcontainer")

				if (container.find("div").length > 500) {
					container.find("div").slice(0, 200).remove()
				}

				try {
					container.find(".temporary").remove()

					container.append(`
			            <div class=${summarize ? "temporary" : "static"} style="display: flex;">
			                <div style="display: flex; flex-direction: column; justify-content: center;">
													<span>
														<b>Mbak AI:</b>
														<span style="color:${color}">${sanitize(text)}</span>
													</span>
			                </div>
			            </div>
									<hr />
			        `)
				} catch (err) {
					console.log(err)
				}

				container.stop()
				window.scrollTo(0, document.body.scrollHeight);
			}

			/**
			 * Add a new message to the chat container
			 */
			async function addChatItem(color, data, text, summarize) {
				const prompt = text
				const user = data.uniqueId
				if ( user !== window.settings.username ) {
					history.last += `${user} berkomentar: ${prompt}.\n`
				}
			}

      async function addChatSocialItem(color, data, text, summarize) {
				const prompt = text
				const user = data.uniqueId
				history.last += `${user}: ${prompt}.\n`
			}

			/**
			 * Add a new gift to the gift container
			 */
			function addGiftItem(data) {
				const user = data.uniqueId
				history.last += `${user} ngasih gift sejumlah ${(data.diamondCount * data.repeatCount).toLocaleString()} Coin.\n`
			}

			// viewer stats
			connection.on("roomUser", (msg) => {
				if (typeof msg.viewerCount === "number") {
					viewerCount = msg.viewerCount
					updateRoomStats()
				}
			})

			// New chat comment received
			connection.on("chat", (msg) => {
				if (window.settings.showChats === "0") return

				addChatItem("", msg, msg.comment)
			})

			// New gift received
			connection.on("gift", (data) => {
				if (!isPendingStreak(data) && data.diamondCount > 0) {
					diamondsCount += data.diamondCount * data.repeatCount
					updateRoomStats()
				}

				if (window.settings.showGifts === "0") return

				addGiftItem(data)
			})

			// share, follow
			connection.on("social", (data) => {
				if (window.settings.showFollows === "0") return

				let color = data.displayType.includes("follow") ? "#ff005e" : "#2fb816"
				addChatSocialItem(color, data, data.label.replace("{0:user}", ""))
			})

			connection.on("streamEnd", () => {
				$("#stateText").text("Stream ended.")

				console.log(history)

				// schedule next try if obs username set
				if (window.settings.username) {
					setTimeout(() => {
						connect(window.settings.username)
					}, 30000)
				}
			})
		</script>

		<div class="eventcontainer"></div>
		
	</body>
</html>
